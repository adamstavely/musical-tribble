document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

     <span style=\"font-size:12px;color:#64748b;padding-top:3px\">{{ t.dateFmt }}<\u002Fspan>\n                    <span style=\"min-width:0\">\n                      <span style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><span style=\"padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:700;background:{{ t.kindBg }};color:{{ t.kindFg }}\">{{ t.kind }}<\u002Fspan><span style=\"font-weight:600;font-size:13.5px\">{{ t.title }}<\u002Fspan><span style=\"font-size:11.5px;color:#0369a1;font-weight:600\">{{ t.sourceLabel }}<\u002Fspan><\u002Fspan>\n                      <span style=\"display:block;font-size:12.5px;color:#475569;margin-top:3px;line-height:1.45\">{{ t.body }}<\u002Fspan>\n                      <span style=\"display:block;font-size:11.5px;color:#94a3b8;margin-top:3px\">{{ t.repName }} · {{ t.place }}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fbutton>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ personNoTimeline }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:#64748b;font-size:13px;padding:10px 0\">No engagements logged yet.<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"background:#fff;border:1px solid #e5e9f0;border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04);padding:16px;font-size:13px;line-height:1.7\">\n                <div style=\"font-size:11.5px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px\">Contact<\u002Fdiv>\n                <div><a href=\"#\" style=\"text-decoration:none\">{{ person.email }}<\u002Fa><\u002Fdiv>\n                <div>{{ person.phone }}<\u002Fdiv>\n                <div style=\"color:#64748b\">Last contact {{ person.lastContactFmt }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #e5e9f0;border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42, pan> · {{ c.title }}<\u002Fbutton><\u002Fsc-for>\n                <sc-if value=\"{{ personNoColleagues }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:#64748b\">Only known contact<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isAgreements }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-screen-label=\"Agreements\" style=\"padding:32px 36px;animation:fadeUp .3s ease\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px\">\n          <div><h1 style=\"font-family:Geist,Manrope,sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:32px;margin:0 0 4px;letter-spacing:-0.01em\">Agreements &amp; contracts<\u002Fh1><div style=\"color:#64748b\">{{ agrSubtitle }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <sc-for list=\"{{ agrFilters }}\" as=\"f\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ f.pick }}\" style=\"border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer\">{{ f.label }}<\u002Fbutton><\u002Fsc-for>\n            <div style=\"display:flex;background:#eaeef4;border-radius:7px;padding:3px;margin-left:8px\">\n              <sc-for list=\"{{ agrLayouts }}\" as=\"l\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ l.pick }}\" style=\"border:0;padding:6px 12px;border-radius:5px;font-size:12.5px;font-weight:600;cursor:pointer;background:{{ l.bg }};color:{{ l.fg }}\">{{ l.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ agrCal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px lid #e5e9f0;border-radius:10px;padding:22px;position:sticky;top:0\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px\">\n              <div><div style=\"font-size:12px;color:#64748b;margin-bottom:4px\">{{ agr.type }}<\u002Fdiv><div style=\"font-family:Geist,Manrope,sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:22px;line-height:1.2\">{{ agr.title }}<\u002Fdiv><button sc-camel-on-click=\"{{ agr.openOrg }}\" style=\"border:0;background:transparent;padding:0;margin-top:6px;color:#2563eb;font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit\" style-hover=\"text-decoration:underline\">{{ agr.orgName }} →<\u002Fbutton><\u002Fdiv>\n              <span style=\"padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:{{ agr.statusBg }};color:{{ agr.statusFg }};white-space:nowrap\">{{ agr.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0;font-size:13px\">\n              <div><div style=\"font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.06em;font-weight:600\">Value<\u002Fdiv><div style=\"font-weight:600;font-size:16px;margin-top:2px\">{{ agr.valueFmt }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.06em;font-weight:600\">Renewal<\u002Fdiv><div style=\"font-weight:600;font-size:16px;margin-top:2px\">{{ agr.autoRenewText }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.06em;font-weight:600\">Term<\u002Fdiv><div style=\"margin-top:2px\">{{ agr.startFmt }} – {{ agr.endFmt }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.06em;font-weight:600\">Owner<\u002Fdiv><div style=\"margin-top:2px\">{{ agr.ownerName }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ agr.expiringSoon }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#ffe4e6;color:#9f1239;border-radius:7px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:16px\">Renewal window open · {{ agr.daysLeft }}. Consider kicking off a renewal readiness review.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px\">Key terms<\u002Fdiv>\n            <sc-for list=\"{{ agr.termItems }}\" as=\"t\" hint-placeholder-count=\"3\"><div style=\"font-size:13px;padding:7px 0;border-bottom:1px solid #eef2f7\">{{ t.text }}<\u002Fdiv><\u002Fsc-for>\n            <div style=\"font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:16px 0 4px\">Documents<\u002Fdiv>\n            <sc-for list=\"{{ agr.docs }}\" as=\"x\" hint-placeholder-count=\"1\"><button sc-camel-on-click=\"{{ x.open }}\" style=\"display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:7px 0;border-bottom:1px solid #eef2f7;cursor:pointer;color:#0f172a\" style-hover=\"color:#2563eb\"><span style=\"padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:700;background:{{ x.typeBg }};color:{{ x.typeFg }};flex:none\">{{ x.type }}<\u002Fspan><span style=\"flex:1;min-width:0;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ x.name }}<\u002Fspan><span style=\"font-size:11.5px;color:#94a3b8;white-space:nowrap\">{{ x.size }}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n            <sc-if value=\"{{ agr.noDocs }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:#94a3b8;padding:6px 0\">No documents attached<\u002Fdiv><\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ agr.upload }}\" style=\"margin-top:8px;border:0;background:transparent;color:#2563eb;font v>\n          <sc-if value=\"{{ mfHasOrg }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;font-weight:600;color:#475569;margin:16px 0 6px\">Attendees<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><sc-for list=\"{{ mfAttendees }}\" as=\"p\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ p.pick }}\" style=\"padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid {{ p.border }};background:{{ p.bg }};color:{{ p.fg }}\">{{ p.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n          <div style=\"font-size:12px;font-weight:600;color:#475569;margin:16px 0 6px\">Outcome<\u002Fdiv>\n          <textarea value=\"{{ mfOutcome }}\" sc-camel-on-change=\"{{ mfOutcomeChange }}\" placeholder=\"What was decided, learned or promised?\" style=\"width:100%;border:1px solid #d5dbe5;border-radius:7px;padding:9px 11px;font-size:13px;outline:none;background:#fff;color:#0f172a;min-height:70px;resize:vertical\" style-focus=\"border-color:#2563eb\"><\u002Ftextarea>\n          <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:24px\"><button sc-camel-on-click=\"{{ mfCancel }}\" style=\"border:1px solid #d5dbe5;background:#fff;color:#0f172a;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer\">Cancel<\u002Fbutton><button sc-camel-on-click=\"{{ mfSave }}\" disabled=\"{{ mfDisabled }}\" style=\"border:0;background:#2563eb;color:#fff;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;opacity:{{ mfOpacity }}\">Save meeting<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ ffOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;inset:0;background:rgba(15,23,42,.4);display:grid;place-items:center;z-index:20;animation:fadeUp .2s ease\">\n        <div style=\"width:580px;max-width:92vw;max-height:90vh;overflow:auto;background:# 0%;border:1px solid #d5dbe5;border-radius:7px;padding:9px 11px;font-size:13px;outline:none;background:#fff;color:#0f172a;min-height:70px;resize:vertical\" style-focus=\"border-color:#2563eb\"><\u002Ftextarea>\n          <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:24px\"><button sc-camel-on-click=\"{{ ffCancel }}\" style=\"border:1px solid #d5dbe5;background:#fff;color:#0f172a;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer\">Cancel<\u002Fbutton><button sc-camel-on-click=\"{{ ffSave }}\" disabled=\"{{ ffDisabled }}\" style=\"border:0;background:#2563eb;color:#fff;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;opacity:{{ ffOpacity }}\">Submit &amp; mark complete<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isMeetings }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-screen-label=\"Meetings\" style=\"display:flex;flex-direction:column;height:100%;animation:fadeUp .3s ease\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 36px 16px\">\n          <div><h1 style=\"font-family:Geist,Manrope,sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:32px;margin:0 0 4px;letter-spacing:-0.01em\">Meetings<\u002Fh1><div style=\"color:#64748b\">{{ meetSubtitle }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n            <sc-if value=\"{{ isManager }}\" hint-placeholder-val=\"{{ true }}\"><sc-for list=\"{{ meetRepChips }}\" as=\"r\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ r.pick }}\" style=\"border:1px solid {{ r.border }};background:{{ r.bg }};color:{{ r.fg }};padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer\">{{ r.label }}<\u002Fbutton><\u002Fsc-for><\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ logMeetingBtn }}\" style=\"border:0;background:#2563eb;color:#fff;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;padding:7px 12px;font-size:12.5px\" style-hover=\"background:#1d4ed8\">+ Log meeting<\u002Fbutton>\n            <div style=\"display:flex;background:#eaeef4;border-radius:7px;padding:3px;margin-left:8px\">\n              <sc-for list=\"{{ meetLayouts }}\" as=\"l\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ l.pick }}\" style=\"border:0;padding:6px 12px;border-radius:5px;font-size:12.5px;font-weight:600;cursor:pointer;background:{{ l.bg }};color:{{ l.fg }}\">{{ l.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:{{ meetCols }};grid-template-rows:{{ meetRowsTpl }};gap:0;border-top:1px solid #e5e9f0\">\n          <div style=\"overflow:auto;background:#fff;display:{{ meetTableDisplay }}\">\n            <div style=\"display:grid;grid-template-columns:72px minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,.8fr);gap:12px;padding:10px 24px;font-size:11.5px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #e5e9f0;position:sticky;top:0;background:#fff\"><span>Date<\u002Fspan><span>Meeting<\u002Fspan><span>With<\u002Fspan><span>Where<\u002Fspan><span>Owner<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ meetRows }}\" as=\"m\" hint-placeholder-count=\"10\">\n              <button sc-camel-on-click=\"{{ m.select }}\" style=\"display:grid;grid-template-columns:72px minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,.8fr);gap:12px;align-items:start;overflow-wrap:anywhere;width:100%;text-align:left;border:0;border-left:3px solid {{ m.selLine }};border-bottom:1px solid #eef2f7;background:{{ m.selBg }};padding:12px 24px 12px 21px;cursor:pointer;font-size:13px;color:#0f172a\" style-hover=\"background:#f8fafc\">\n                <span style=\"color:#64748b;font-size:12.5px\">{{ m.dateFmt }}<span style=\"display:block\">{{ m.time }}<\u002Fspan><\u002Fspan>\n                <span style=\"min-width:0\"><span style=\"font-weight:600;display:block\">{{ m.title }}<\u002Fspan><span style=\"font-size:12px;color:#64748b\">{{ m.type }}<\u002Fspan><span style=\"display:block;font-size:11px;color:#0369a1;font-weight:600\">{{ m.sourceLabel }}<\u002Fspan><\u002Fspan>\n                <span style=\"min-width:0\"><span style=\"font-weight:600;display:block\">{{ m.orgName }}<\u002Fspan><span style=\"font-size:12px;color:#64748b\">{{ m.attendeeNames }}<\u002Fspan><\u002Fspan>\n                <span style=\"font-size:12.5px;color:#475569\">{{ m.place }}<span style=\"display:block;color:#64748b;font-size:12px\">{{ m.city }}<\u002Fspan><\u002Fspan>\n                <span style=\"font-size:12.5px\">{{ m.repName }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"position:relative;display:{{ meetMapDisplay }};border-left:1px solid #e5e9f0\">\n            <iframe id=\"meetMap\" src=\"{{ mapSrc }}\" title=\"Meeting locations\" style=\"width:100%;height:100%;border:0;display:block\"><\u002Fiframe>\n            <sc-if value=\"{{ meetHasSel }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 10px 30px #cbd5e1;z-index:500;animation:fadeUp .25s ease\">\n                <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:flex-start\">\n                  <div><div style=\"font-size:12px;color:#64748b\">{{ meetSel.dateFmt }} · {{ meetSel.time }} · {{ meetSel.type }}<\u002Fdiv><div style=\"font-family:Geist,Manrope,sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:20px;margin-top:2px\">{{ meetSel.title }}<\u002Fdiv><button sc-camel-on-click=\"{{ meetSel.openOrg }}\" style=\"border:0;background:transparent;padding:0;color:#2563eb;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit\" style-hover=\"text-decoration:underline\">{{ meetSel.orgName }} →<\u002Fbutton><\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ meetClear }}\" style=\"border:0;background:transparent;font-size:18px;cursor:pointer;color:#64748b;line-height:1\">×<\u002Fbutton>\n                <\u002Fdiv>\n                <p style=\"margin:10px 0 6px;font-size:13px;line-height:1.5\">{{ meetSel.outcome }}<\u002Fp>\n                <div style=\"font-size:12.5px;color:#475569\"><span style=\"font-weight:600;color:#e11d48\">Next:<\u002Fspan> {{ meetSel.next }}<\u002Fdiv>\n                <div style=\"display:flex;gap:6px;margin-top:10px;flex-wrap:wrap\"><sc-for list=\"{{ meetSel.attendeeList }}\" as=\"p\" hint-placeholder-count=\"1\"><button sc-camel-on-click=\"{{ p.open }}\" style=\"border:1px solid #d5dbe5;background:#fff;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:#0f172a\" style-hover=\"border-color:#2563eb\">{{ p.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                <sc-if value=\"{{ meetSel.hasDocs }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;gap:6px;margin-top:8px;flex-wrap:wrap\"><sc-for list=\"{{ meetSel.docs }}\" as=\"x\" hint-placeholder-count=\"1\"><button sc-camel-on-click=\"{{ x.open }}\" style=\"border:0;background:{{ x.typeBg }};color:{{ x.typeFg }};padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer\">{{ x.type }} · {{ x.name }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isResearch }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-screen-label=\"Research\" style=\"padding:40px 36px;max-width:1100px;margin:0 auto;animation:fadeUp .3s ease\">\n        <h1 style=\"font-family:Geist,Manrope,sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:32px;margin:0 0 6px;letter-spacing:-0.01em\">What do we know?<\u002Fh1>\n        <div style=\"color:#64748b;margin-bottom:18px\">Search across people, organizations, agreements, meeting notes and review findings.<\u002Fdiv>\n        <input value=\"{{ q }}\" sc-camel-on-change=\"{{ onQ }}\" placeholder=\"Try “SSO”, “Kestrel”, “Wes Tanaka”, “union”, “data residency”…\" style=\"width:100%;border:1px solid #d5dbe5;background:#fff;border-radius:10px;padding:16px 18px;font-size:17px;outline:none;box-shadow:0 2px 10px rgba(0,0,0,.04)\" style-focus=\"border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)\">\n        <sc-if value=\"{{ rsEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center\"><span style=\"font-size:12.5px;color:#64748b\">Recent:<\u002Fspan><sc-for list=\"{{ rsSuggestions }}\" as=\"t\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ t.pick }}\" style=\"border:1px solid #d5dbe5;background:#fff;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;color:#0f172a\" style-hover=\"border-color:#2563eb\">{{ t.text }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rsHasResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:24px;align-items:start\">\n            <div>\n              <div style=\"font-size:12.5px;color:#64748b;margin-bottom:12px\">{{ rsCount }}<\u002Fdiv>\n              <sc-for list=\"{{ rsGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div style=\"margin-bottom:18px\">\n                  <div style=\"font-size:11.5px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px\">{{ g.label }}<\u002Fdiv>\n                  <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                    <button sc-camel-on-click=\"{{ it.pick }}\" style=\"display:block;width:100%;text-align:left;border:1px solid {{ it.border }};background:#fff;border-radius:8px;padding:11px 14px;margin-bottom:6px;cursor:pointer;color:#0f172a\" style-hover=\"border-color:#2563eb\">\n                      <div style=\"font-weight:600;font-size:13.5px\">{{ it.title }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#475569;margin-top:2px;line-height:1.45\">{{ it.snippet }}<\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:#0f172a;color:#f1f5f9;border-radius:12px;padding:24px;position:sticky;top:20px\">\n              <div style=\"font-size:11.5px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em\">{{ rsSel.kind }}<\u002Fdiv>\n              <div style=\"font-family:Geist,Manrope,sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:26px;margin:4px 0 2px\">{{ rsSel.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#cbd5e1;margin-bottom:16px\">{{ rsSel.subtitle }}<\u002Fdiv>\n              <sc-for list=\"{{ rsSel.facts }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div style=\"display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px;line-height:1.5\"><span style=\"color:#94a3b8\">{{ f.k }}<\u002Fspan><span>{{ f.v }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ rsSel.open }}\" style=\"margin-top:18px;border:0;background:#2563eb;color:#fff;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer\" style-hover=\"background:#1d4ed8\">{{ rsSel.cta }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rsNoResults }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:28px;color:#64748b\">Nothing matches “{{ q }}”.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;bottom:22px;right:24px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastIn .25s ease\">{{ toast }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;team&quot;,&quot;pipeline&quot;,&quot;orgs&quot;,&quot;people&quot;,&quot;agreements&quot;,&quot;reviews&quot;,&quot;meetings&quot;,&quot;research&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;comfortable&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;startRole&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;jordan&quot;,&quot;options&quot;:[&quot;jordan&quot;,&quot;maya&quot;,&quot;daniel&quot;,&quot;priya&quot;,&quot;tom&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nclass Component extends DCLogic {\n  state = { view: 'home', role: 'jordan', rolePickerOpen: false, notifOpen: false, orgId: null, orgTab: 'overview', personId: null, agrId: null, reviewId: null, meetingId: null, repFilter: 'all', pipeMode: 'active', meetLayout: 'split', meetRep: 'all', agrLayout: 'list', q: '', researchSel: null, kickoff: null, personForm: null, meetingForm: null, findingsForm: null, noteDraft: '', integrations: { calendar: true, email:
